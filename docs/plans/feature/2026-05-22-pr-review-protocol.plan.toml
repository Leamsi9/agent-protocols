title = "PR review protocol update"
branch = "main"
baseline = "origin/main"
root_dir = "../../.."
phase_order = [
  "setup",
  "protocol_updates",
  "packaging",
  "validation",
  "closeout",
]

[phases.setup]
summary = "Establish the branch-owned worktree and durable plan."

[[phases.setup.checks]]
id = "branch-worktree-bound"
type = "git_branch_worktree"
repo = "."
branch = "main"
path = "."

[[phases.setup.checks]]
id = "plan-exists"
type = "path_exists"
path = "docs/plans/feature/2026-05-22-pr-review-protocol.md"

[[phases.setup.checks]]
id = "manifest-exists"
type = "path_exists"
path = "docs/plans/feature/2026-05-22-pr-review-protocol.plan.toml"

[phases.protocol_updates]
summary = "Add final code review and PR-body protocol guidance."
depends_on = ["setup"]

[[phases.protocol_updates.checks]]
id = "substantive-review-gate"
type = "text_present"
path = "substantive-work-protocol.md"
text = "## Final Code Review Gate"

[[phases.protocol_updates.checks]]
id = "substantive-temp-cleanup-gate"
type = "text_present"
path = "substantive-work-protocol.md"
text = "## Temp Artifact Cleanup Gate"

[[phases.protocol_updates.checks]]
id = "substantive-side-effects-tested"
type = "text_present"
path = "substantive-work-protocol.md"
text = "Do not guess that"

[[phases.protocol_updates.checks]]
id = "substantive-independent-review"
type = "text_present"
path = "substantive-work-protocol.md"
text = "fresh independent review context"

[[phases.protocol_updates.checks]]
id = "substantive-subagent-review"
type = "text_present"
path = "substantive-work-protocol.md"
text = "subagent"

[[phases.protocol_updates.checks]]
id = "substantive-review-fallback"
type = "text_present"
path = "substantive-work-protocol.md"
text = "independent-style full-diff review"

[[phases.protocol_updates.checks]]
id = "substantive-review-loop-criteria"
type = "text_present"
path = "substantive-work-protocol.md"
text = "another review would mainly reread an unchanged diff"

[[phases.protocol_updates.checks]]
id = "minor-review-gate"
type = "text_present"
path = "minor-work-protocol.md"
text = "## Final Code Review Gate"

[[phases.protocol_updates.checks]]
id = "minor-temp-cleanup-gate"
type = "text_present"
path = "minor-work-protocol.md"
text = "## Temp Artifact Cleanup Gate"

[[phases.protocol_updates.checks]]
id = "minor-side-effects-tested"
type = "text_present"
path = "minor-work-protocol.md"
text = "Do not guess that"

[[phases.protocol_updates.checks]]
id = "minor-independent-review"
type = "text_present"
path = "minor-work-protocol.md"
text = "fresh independent review context"

[[phases.protocol_updates.checks]]
id = "minor-subagent-review"
type = "text_present"
path = "minor-work-protocol.md"
text = "subagent"

[[phases.protocol_updates.checks]]
id = "minor-review-fallback"
type = "text_present"
path = "minor-work-protocol.md"
text = "independent-style full-diff review"

[[phases.protocol_updates.checks]]
id = "minor-review-loop-criteria"
type = "text_present"
path = "minor-work-protocol.md"
text = "another review would mainly reread an unchanged diff"

[[phases.protocol_updates.checks]]
id = "pr-protocol-exists"
type = "path_exists"
path = "pull-request-protocol.md"

[[phases.protocol_updates.checks]]
id = "pr-protocol-required-format"
type = "regex_present"
path = "pull-request-protocol.md"
pattern = "(?s)## Issue or Feature.*## Implementation Rationale.*## Risks and Mitigations.*## Tests"

[[phases.protocol_updates.checks]]
id = "pr-protocol-independent-review"
type = "text_present"
path = "pull-request-protocol.md"
text = "fresh independent review context"

[[phases.protocol_updates.checks]]
id = "pr-protocol-subagent-review"
type = "text_present"
path = "pull-request-protocol.md"
text = "subagent"

[[phases.protocol_updates.checks]]
id = "pr-protocol-review-fallback"
type = "text_present"
path = "pull-request-protocol.md"
text = "independent-style full-diff review"

[[phases.protocol_updates.checks]]
id = "pr-protocol-review-loop-criteria"
type = "text_present"
path = "pull-request-protocol.md"
text = "another review would mainly reread an unchanged diff"

[[phases.protocol_updates.checks]]
id = "merge-protocol-invokes-pr-protocol"
type = "text_present"
path = "merge-to-main-protocol.md"
text = "[Pull request protocol](pull-request-protocol.md)"

[[phases.protocol_updates.checks]]
id = "merge-protocol-vendor-refresh-consumer-controlled"
type = "text_present"
path = "merge-to-main-protocol.md"
text = "Vendored `agent-protocols/` refreshes are package-maintenance changes"

[[phases.protocol_updates.checks]]
id = "merge-protocol-vendor-refresh-no-exception"
type = "text_present"
path = "merge-to-main-protocol.md"
text = "not an exception to the consumer repo's branch, review, CI, or merge rules"

[[phases.protocol_updates.checks]]
id = "merge-protocol-vendor-refresh-no-auto-push"
type = "text_present"
path = "merge-to-main-protocol.md"
text = "Do not auto-push or auto-merge"

[phases.packaging]
summary = "Wire the PR protocol into vendoring and package docs."
depends_on = ["protocol_updates"]

[[phases.packaging.checks]]
id = "installer-vendors-pr-protocol"
type = "text_present"
path = "scripts/install.py"
text = "\"pull-request-protocol.md\""

[[phases.packaging.checks]]
id = "readme-lists-pr-protocol"
type = "text_present"
path = "README.md"
text = "pull-request-protocol.md"

[[phases.packaging.checks]]
id = "version-file-updated"
type = "text_present"
path = "VERSION"
text = "0.0.18"

[[phases.packaging.checks]]
id = "readme-version-updated"
type = "text_present"
path = "README.md"
text = "Experimental package version: `0.0.18`"

[[phases.packaging.checks]]
id = "readme-vendor-refresh-consumer-controlled"
type = "text_present"
path = "README.md"
text = "Default refresh closeout is controlled by the consumer repo"

[[phases.packaging.checks]]
id = "readme-vendor-refresh-no-auto-push"
type = "text_present"
path = "README.md"
text = "do not auto-push or auto-merge"

[[phases.packaging.checks]]
id = "syncing-vendor-refresh-consumer-controlled"
type = "text_present"
path = "SYNCING.md"
text = "Vendored package refresh closeout belongs to the consumer repo"

[[phases.packaging.checks]]
id = "syncing-vendor-refresh-no-auto-push"
type = "text_present"
path = "SYNCING.md"
text = "does not make a refresh eligible for automatic `main` pushes"

[[phases.packaging.checks]]
id = "merge-protocol-check-guards-no-auto-push"
type = "text_present"
path = "scripts/check_merge_to_main_protocol.py"
text = "Do not auto-push or auto-merge"

[[phases.packaging.checks]]
id = "installer-pr-protocol-test"
type = "command"
command = "python3 -m unittest tests.test_repo_state.RepoStateTests.test_installer_vendors_pull_request_protocol"

[phases.validation]
summary = "Run full package validation."
depends_on = ["packaging"]

[[phases.validation.checks]]
id = "all-tests"
type = "command"
command = "python3 -m unittest discover -s tests"

[[phases.validation.checks]]
id = "all-scripts-compile"
type = "command"
command = "python3 -m py_compile scripts/*.py"

[[phases.validation.checks]]
id = "diff-check"
type = "command"
command = "git diff --check"

[phases.closeout]
summary = "Commit the package change and leave the branch clean."
depends_on = ["validation"]

[[phases.closeout.checks]]
id = "head-ahead-origin-main"
type = "git_head_ahead"
repo = "."
baseline = "origin/main"
ref = "HEAD"

[[phases.closeout.checks]]
id = "worktree-clean"
type = "git_clean"
repo = "."
