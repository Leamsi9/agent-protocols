title = "PR review protocol update"
branch = "feature/pr-review-protocol-2026-05-22"
baseline = "origin/main"
root_dir = "../../.."
phase_order = [
  "setup",
  "protocol_updates",
  "packaging",
  "validation",
  "closeout",
]

[phases.setup]
summary = "Establish the branch-owned worktree and durable plan."

[[phases.setup.checks]]
id = "branch-worktree-bound"
type = "git_branch_worktree"
repo = "."
branch = "feature/pr-review-protocol-2026-05-22"
path = "."

[[phases.setup.checks]]
id = "plan-exists"
type = "path_exists"
path = "docs/plans/feature/2026-05-22-pr-review-protocol.md"

[[phases.setup.checks]]
id = "manifest-exists"
type = "path_exists"
path = "docs/plans/feature/2026-05-22-pr-review-protocol.plan.toml"

[phases.protocol_updates]
summary = "Add final code review and PR-body protocol guidance."
depends_on = ["setup"]

[[phases.protocol_updates.checks]]
id = "substantive-review-gate"
type = "text_present"
path = "substantive-work-protocol.md"
text = "## Final Code Review Gate"

[[phases.protocol_updates.checks]]
id = "substantive-side-effects-tested"
type = "text_present"
path = "substantive-work-protocol.md"
text = "Do not guess that side effects are safe."

[[phases.protocol_updates.checks]]
id = "minor-review-gate"
type = "text_present"
path = "minor-work-protocol.md"
text = "## Final Code Review Gate"

[[phases.protocol_updates.checks]]
id = "minor-side-effects-tested"
type = "text_present"
path = "minor-work-protocol.md"
text = "Do not guess that side effects are safe"

[[phases.protocol_updates.checks]]
id = "pr-protocol-exists"
type = "path_exists"
path = "pull-request-protocol.md"

[[phases.protocol_updates.checks]]
id = "pr-protocol-required-format"
type = "regex_present"
path = "pull-request-protocol.md"
pattern = "(?s)## Issue or Feature.*## Implementation Rationale.*## Risks and Mitigations.*## Tests"

[[phases.protocol_updates.checks]]
id = "merge-protocol-invokes-pr-protocol"
type = "text_present"
path = "merge-to-main-protocol.md"
text = "[Pull request protocol](pull-request-protocol.md)"

[phases.packaging]
summary = "Wire the PR protocol into vendoring and package docs."
depends_on = ["protocol_updates"]

[[phases.packaging.checks]]
id = "installer-vendors-pr-protocol"
type = "text_present"
path = "scripts/install.py"
text = "\"pull-request-protocol.md\""

[[phases.packaging.checks]]
id = "readme-lists-pr-protocol"
type = "text_present"
path = "README.md"
text = "pull-request-protocol.md"

[[phases.packaging.checks]]
id = "version-file-updated"
type = "text_present"
path = "VERSION"
text = "0.0.14"

[[phases.packaging.checks]]
id = "readme-version-updated"
type = "text_present"
path = "README.md"
text = "Experimental package version: `0.0.14`"

[[phases.packaging.checks]]
id = "installer-pr-protocol-test"
type = "command"
command = "python3 -m unittest tests.test_repo_state.RepoStateTests.test_installer_vendors_pull_request_protocol"

[phases.validation]
summary = "Run full package validation."
depends_on = ["packaging"]

[[phases.validation.checks]]
id = "all-tests"
type = "command"
command = "python3 -m unittest discover -s tests"

[[phases.validation.checks]]
id = "all-scripts-compile"
type = "command"
command = "python3 -m py_compile scripts/*.py"

[[phases.validation.checks]]
id = "diff-check"
type = "command"
command = "git diff --check"

[phases.closeout]
summary = "Commit the package change and leave the branch clean."
depends_on = ["validation"]

[[phases.closeout.checks]]
id = "head-ahead-origin-main"
type = "git_head_ahead"
repo = "."
baseline = "origin/main"
ref = "HEAD"

[[phases.closeout.checks]]
id = "worktree-clean"
type = "git_clean"
repo = "."
