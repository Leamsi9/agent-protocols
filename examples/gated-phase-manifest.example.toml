# Optional automation, not the default planning artifact. One concise Markdown
# plan is sufficient. Copy only checks that prove a real boundary for your task.
# This example proves source readiness, not independent review or live behavior.
# Replace the illustrative test command and removal check before running it.
title = "Example source acceptance boundary"
branch = "feature/example-workstream"
baseline = "origin/main"
root_dir = "../../.."
phase_order = ["implementation"]

# Run from the assigned checkout:
# python3 agent-protocols/scripts/check_gated_plan.py path/to/work.plan.toml --phase implementation

[phases.implementation]
summary = "Implement the active slice."

[[phases.implementation.checks]]
id = "targeted-tests"
type = "command"
command = "cargo test --test substantive_work_protocol -- --nocapture"

[[phases.implementation.checks]]
id = "repo-clean"
type = "git_clean"
repo = "."

[[phases.implementation.checks]]
id = "head-ahead-of-baseline"
type = "git_head_ahead"
repo = "."

[[phases.implementation.checks]]
id = "branch-worktree-bound"
type = "git_branch_worktree"
repo = "."
current = true

[[phases.implementation.checks]]
id = "old-authoritative-surface-gone"
type = "regex_absent"
path = "some/file/or/doc.md"
pattern = "old authoritative path"
